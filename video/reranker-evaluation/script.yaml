youtube:
  title: "Adding a Reranker and Proving It Helped | LLM System Design"
  altTitles:
    - "Does Your Reranker Actually Help? How to Prove It"
    - "Cross-Encoder Rerankers for RAG: Sizing, Evals and A/B Tests"
  summary: |
    A cross-encoder reranker rescores the first stage's top 50-200 candidates and passes the best 5-20 to the LLM. This video covers how to add one and how to prove it helped: choosing the candidate depth, picking a model, a worked latency estimate, a timeout fallback, paired offline evals at the cutoff the LLM actually sees, how many queries you need to detect a gain, end-to-end checks, slices, a guarded online A/B test, and the net-cost math that often makes a reranker cheaper than running without one.

    Part 5 of the LLM System Design series from VidyalAI.
    Part 1, designing a RAG system for 10 million documents: https://youtu.be/_ric0wnAKrE
    Part 2, debugging a RAG system that gives wrong answers: https://youtu.be/TLINef2z4F8
    Part 3, chunking legal contracts for retrieval: https://youtu.be/tl9HIgUdsnQ
    Part 4, BM25 vs dense vs hybrid search: https://youtu.be/Ayvmk_rm1fc
    The full playlist: https://www.youtube.com/playlist?list=PLTy3a2upFmcM
