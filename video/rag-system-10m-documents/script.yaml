  - id: short-retrieval-first
    title: "Your RAG gave a wrong answer. Check this first #shorts"
    description: Before you change the prompt or the model, find out whether retrieval ever found the evidence.
    hashtags: ["#RAG", "#LLM", "#shorts"]
    scenes:
      - type: statement
        text: Your RAG system gave a **wrong answer**.
        sub: Before you touch the prompt, check retrieval.
        subStep: 1
        steps:
          - say: Your RAG system just gave a wrong answer.
          - say: Before you touch the prompt, or switch models, check retrieval.
      - type: bullets
        heading: Ask, in order
        numbered: true
        steps:
          - add: Is the answer in your documents?
            say: Ask, in order. Is the answer even in your documents?
          - add: { text: Did retrieval find it?, sub: In the top 200 candidates }
            say: Did retrieval find it, in the top 200 candidates?
          - add: { text: Did it reach the prompt?, sub: After reranking }
            say: Did it survive reranking, and make it into the prompt?
          - add: Did the model use it correctly?
            say: Only then, ask whether the model used it correctly.
      - type: statement
        text: Most failures start in **retrieval**.
        sub: And retrieval is the cheapest part to measure.
        steps:
          - say: Most wrong answers start in retrieval. And retrieval is the cheapest part to measure.
      - type: outro
        title: Full design
        url: vidyal.ai
        steps:
          - say: The full design is on vidyal.ai.

  - id: short-acl-filter
    title: "The RAG bug that leaks data #shorts"
    description: Filtering permissions after retrieval can return zero results and leak timing information. Filter during the search instead.
    hashtags: ["#RAG", "#Security", "#shorts"]
    scenes:
      - type: statement
        text: The RAG bug that **leaks data**
        steps:
          - say: Here's a RAG bug that leaks data.
      - type: bullets
        heading: Retrieve first, filter later
        style: warn
        steps:
          - add: { text: Fetch the top 100 results, sub: then drop what the user can't see }
            say: >-
              Many systems fetch the top 100 results, and then remove the ones the user isn't
              allowed to see.
          - add: { text: Selective permission, sub: zero results left }
            say: With a selective permission, nothing is left. Zero results.
          - add: { text: Timing gives it away, sub: slow responses reveal hidden documents exist }
            say: Worse, how long it takes can reveal that hidden documents exist.
      - type: statement
        text: Filter **during** the search.
        sub: Keep ACLs in the index, or shard per tenant.
        steps:
          - say: >-
              The fix: keep permissions in the index, and filter during the search, or shard per
              tenant.
      - type: outro
        title: Full design
        url: vidyal.ai
        steps:
          - say: The full design is on vidyal.ai.

