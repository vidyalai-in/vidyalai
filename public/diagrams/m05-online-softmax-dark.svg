orm="translate(-60, -45)"><rect/><foreignObject width="120" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel"><p>Add the block:<br />l += e^(z-M)<br />acc += e^(z-M) v<br />then m = M</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-G-9" data-look="neo" transform="translate(1066.5, 122.99999999999999)"><polygon points="94.5,0 189,-94.5 94.5,-189 0,-94.5" class="label-container" transform="translate(-94, 94.5)"/><g class="label" style="" transform="translate(-60, -22.5)"><rect/><foreignObject width="120" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel"><p>More<br />blocks?</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-H-13" data-look="neo" transform="translate(1337.6875, 122.99999999999999)"><rect class="basic label-container" style="" x="-76" y="-34.5" width="152" height="69"/><g class="label" style="" transform="translate(-60, -22.5)"><rect/><foreignObject width="120" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel"><p>Output = acc / l<br />LSE = m + ln l</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" st